sources:
  - name: lancommander
    repo: LANCommander/LANCommander
    ref: main
    paths:
      - from: LANCommander.Documentation/
        to: Documentation/

  - name: interposer
    repo: LANCommander/LANCommander.Interposer
    ref: main
    paths:
      - from: LANCommander.Interposer.Documentation/
        to: Interposer/

# Game servers come from the LANCommander.Servers monorepo: every <root><Server>/ directory
# that has a <from> directory is synced to <to>/<Server>. Its version is the newest
# <Server>/v* tag in that repo.
servers:
  repo: LANCommander/LANCommander.Servers
  ref: main
  root: Servers/
  from: Documentation/
  to: GameServers/

  # Server directory -> folder name, for servers whose docs path predates the monorepo
  overrides:
    Battlefield1942: BF1942
    Quake3: Quake3Arena

  # Server directories to never sync
  exclude: []
