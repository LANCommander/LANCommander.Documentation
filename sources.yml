sources:
  - name: lancommander
    repo: LANCommander/LANCommander
    ref: main
    paths:
      - from: LANCommander.Documentation/
        to: Documentation/

  - name: interposer
    repo: LANCommander/LANCommander.Interposer
    ref: main
    paths:
      - from: LANCommander.Interposer.Documentation/
        to: Interposer/

# Game servers are discovered automatically: every non-archived repo in the org
# named <prefix>* that has a <from> directory on its default branch is synced
# to <to>/<suffix>, where <suffix> is the repo name with the prefix removed.
servers:
  org: LANCommander
  prefix: LANCommander.Servers.
  from: Documentation/
  to: GameServers/

  # Repo suffix -> folder name, for servers whose docs path predates discovery
  overrides:
    Battlefield1942: BF1942
    Quake3: Quake3Arena

  # Repo suffixes to never sync
  exclude: []
