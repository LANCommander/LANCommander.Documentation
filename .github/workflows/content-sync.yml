name: Sync external docs sources

on:
  workflow_dispatch:
  repository_dispatch:
    types: [docs-sources-updated]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Docusaurus repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for tagging

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Collect sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # One line per path mapping: name<TAB>repo<TAB>ref<TAB>from<TAB>to
          yq -r '.sources[] | . as $s | .paths[] | [$s.name, $s.repo, ($s.ref // "main"), .from, .to] | @tsv' sources.yml > /tmp/sources.tsv

          ORG="$(yq -r '.servers.org' sources.yml)"
          PREFIX="$(yq -r '.servers.prefix' sources.yml)"
          FROM="$(yq -r '.servers.from' sources.yml)"
          TO="$(yq -r '.servers.to' sources.yml)"

          gh api --paginate "orgs/$ORG/repos?type=public&per_page=100" \
            --jq ".[] | select(.archived | not) | select(.name | startswith(\"$PREFIX\")) | [.name, .default_branch] | @tsv" \
            | sort > /tmp/servers.tsv

          while IFS=$'\t' read -r REPO_NAME REF; do
            SUFFIX="${REPO_NAME#"$PREFIX"}"

            if [ "$(SUFFIX="$SUFFIX" yq '.servers.exclude // [] | contains([strenv(SUFFIX)])' sources.yml)" = "true" ]; then
              echo "Skipping $REPO_NAME (excluded)"
              continue
            fi

            if ! gh api "repos/$ORG/$REPO_NAME/contents/${FROM%/}?ref=$REF" --silent 2>/dev/null; then
              echo "Skipping $REPO_NAME (no ${FROM%/} directory on $REF)"
              continue
            fi

            FOLDER="$(SUFFIX="$SUFFIX" yq -r '.servers.overrides[strenv(SUFFIX)] // strenv(SUFFIX)' sources.yml)"
            NAME="$(echo "$FOLDER" | tr '[:upper:]' '[:lower:]')"

            printf '%s\t%s\t%s\t%s\t%s\n' "$NAME" "$ORG/$REPO_NAME" "$REF" "$FROM" "${TO%/}/$FOLDER" >> /tmp/sources.tsv
          done < /tmp/servers.tsv

          cat /tmp/sources.tsv

      - name: Sync sources
        run: |
          set -euo pipefail

          mkdir -p .external
          COMMIT_LINES=()
          TAGS_TO_CREATE=()
          SYNCED=""

          while IFS=$'\t' read -r NAME REPO REF FROM TO; do
            DEST=".external/$NAME"

            # Clone each source once, even if it has multiple path mappings
            if [[ " $SYNCED " != *" $NAME "* ]]; then
              echo "Syncing $NAME ($REPO@$REF)"

              rm -rf "$DEST"
              git clone --depth 1 --branch "$REF" "https://github.com/${REPO}.git" "$DEST"
              git -C "$DEST" fetch --tags --quiet

              # Latest tag starting with v (IN THE SOURCE REPO)
              LATEST_TAG="$(git -C "$DEST" tag --list 'v*' --sort=-v:refname | head -n 1 | tr -d '[:space:]' || true)"
              VERSION="${LATEST_TAG:-unversioned}"

              COMMIT_LINES+=("$NAME@$VERSION")
              [ -n "$LATEST_TAG" ] && TAGS_TO_CREATE+=("$NAME/$LATEST_TAG")
              SYNCED="$SYNCED $NAME"
            fi

            mkdir -p "$TO"
            rsync -av --delete "$DEST/$FROM" "$TO"
          done < /tmp/sources.tsv

          printf "%s\n" "${COMMIT_LINES[@]}" > /tmp/sources.txt
          printf "%s\n" "${TAGS_TO_CREATE[@]}" > /tmp/tags.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git status --porcelain | grep .; then
            MSG="Sync docs sources\n\n$(cat /tmp/sources.txt)"
            git add -A
            git commit -m "$MSG"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Create source tags
        run: |
          while read -r TAG; do
            [ -z "$TAG" ] && continue

            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "Tag $TAG already exists"
            else
              # Create an annotated tag so you can attach a message
              git tag -a "$TAG" -m "Docs synced from $TAG"
              git push origin "$TAG"
            fi
          done < /tmp/tags.txt
