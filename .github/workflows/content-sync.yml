name: Sync external docs sources

on:
  workflow_dispatch:
  repository_dispatch:
    types: [docs-sources-updated]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Docusaurus repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for tagging

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Collect sources
        run: |
          set -euo pipefail

          # One line per path mapping: name<TAB>repo<TAB>ref<TAB>from<TAB>to
          yq -r '.sources[] | . as $s | .paths[] | [$s.name, $s.repo, ($s.ref // "main"), .from, .to] | @tsv' sources.yml > /tmp/sources.tsv

          cat /tmp/sources.tsv

      - name: Sync sources
        run: |
          set -euo pipefail

          mkdir -p .external
          COMMIT_LINES=()
          TAGS_TO_CREATE=()
          SYNCED=""

          while IFS=$'\t' read -r NAME REPO REF FROM TO; do
            DEST=".external/$NAME"

            # Clone each source once, even if it has multiple path mappings
            if [[ " $SYNCED " != *" $NAME "* ]]; then
              echo "Syncing $NAME ($REPO@$REF)"

              rm -rf "$DEST"
              git clone --depth 1 --branch "$REF" "https://github.com/${REPO}.git" "$DEST"
              git -C "$DEST" fetch --tags --quiet

              # Latest tag starting with v (IN THE SOURCE REPO)
              LATEST_TAG="$(git -C "$DEST" tag --list 'v*' --sort=-v:refname | head -n 1 | tr -d '[:space:]' || true)"
              VERSION="${LATEST_TAG:-unversioned}"

              COMMIT_LINES+=("$NAME@$VERSION")
              [ -n "$LATEST_TAG" ] && TAGS_TO_CREATE+=("$NAME/$LATEST_TAG")
              SYNCED="$SYNCED $NAME"
            fi

            mkdir -p "$TO"
            rsync -av --delete "$DEST/$FROM" "$TO"
          done < /tmp/sources.tsv

          # Game servers: one clone of the monorepo, one docs folder per Servers/<Server>/
          SERVERS_REPO="$(yq -r '.servers.repo' sources.yml)"
          SERVERS_REF="$(yq -r '.servers.ref // "main"' sources.yml)"
          SERVERS_ROOT="$(yq -r '.servers.root' sources.yml)"
          SERVERS_FROM="$(yq -r '.servers.from' sources.yml)"
          SERVERS_TO="$(yq -r '.servers.to' sources.yml)"
          SERVERS_DEST=".external/servers"

          echo "Syncing game servers ($SERVERS_REPO@$SERVERS_REF)"
          rm -rf "$SERVERS_DEST"
          git clone --depth 1 --branch "$SERVERS_REF" "https://github.com/${SERVERS_REPO}.git" "$SERVERS_DEST"
          git -C "$SERVERS_DEST" fetch --tags --quiet

          for DIR in "$SERVERS_DEST/${SERVERS_ROOT%/}"/*/; do
            SERVER="$(basename "$DIR")"

            if [ "$(SERVER="$SERVER" yq '.servers.exclude // [] | contains([strenv(SERVER)])' sources.yml)" = "true" ]; then
              echo "Skipping $SERVER (excluded)"
              continue
            fi

            if [ ! -d "$DIR${SERVERS_FROM%/}" ]; then
              echo "Skipping $SERVER (no ${SERVERS_FROM%/} directory)"
              continue
            fi

            FOLDER="$(SERVER="$SERVER" yq -r '.servers.overrides[strenv(SERVER)] // strenv(SERVER)' sources.yml)"
            NAME="$(echo "$FOLDER" | tr '[:upper:]' '[:lower:]')"

            # Newest <Server>/v* release tag in the monorepo
            LATEST_TAG="$(git -C "$SERVERS_DEST" tag --list "$SERVER/v*" --sort=-v:refname | head -n 1 | tr -d '[:space:]' || true)"
            LATEST_TAG="${LATEST_TAG#"$SERVER/"}"
            VERSION="${LATEST_TAG:-unversioned}"

            COMMIT_LINES+=("$NAME@$VERSION")
            [ -n "$LATEST_TAG" ] && TAGS_TO_CREATE+=("$NAME/$LATEST_TAG")

            mkdir -p "${SERVERS_TO%/}/$FOLDER"
            rsync -av --delete "$DIR$SERVERS_FROM" "${SERVERS_TO%/}/$FOLDER"
          done

          printf "%s\n" "${COMMIT_LINES[@]}" > /tmp/sources.txt
          printf "%s\n" "${TAGS_TO_CREATE[@]}" > /tmp/tags.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git status --porcelain | grep .; then
            MSG="Sync docs sources\n\n$(cat /tmp/sources.txt)"
            git add -A
            git commit -m "$MSG"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Create source tags
        run: |
          while read -r TAG; do
            [ -z "$TAG" ] && continue

            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "Tag $TAG already exists"
            else
              # Create an annotated tag so you can attach a message
              git tag -a "$TAG" -m "Docs synced from $TAG"
              git push origin "$TAG"
            fi
          done < /tmp/tags.txt
